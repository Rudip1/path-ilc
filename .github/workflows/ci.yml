name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import test
        run: |
          python - <<'PY'
          import importlib, pathlib, sys
          sys.path.insert(0, "src")
          for m in sorted(p.stem for p in pathlib.Path("src").glob("*.py")):
              importlib.import_module(m)
              print("imported", m)
          PY

      - name: Smoke test (contact-task experiment, ~5 s)
        run: python src/experiments_contact.py
